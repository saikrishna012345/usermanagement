server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db_test}
    username: ${ORDER_DB_USERNAME:postgres}
    password: ${ORDER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

          product-service:
            connectTimeout: 2000
            readTimeout: 3000

app:
  jwt:
    secret: ${JWT_SECRET:test-only-secret}

eureka:
  client:
    enabled: false

resilience4j:

  circuitbreaker:
    instances:
      productService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      productService:
        maxAttempts: 2
        waitDuration: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO