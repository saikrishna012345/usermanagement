services:

  # ============================================================
  # SERVICE DISCOVERY
  # ============================================================
  eureka-server:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - microservices-network

  # ============================================================
  # CONFIG SERVER
  # ============================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      - eureka-server
    networks:
      - microservices-network

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - microservices-network

  # ============================================================
  # USER DATABASE
  # ============================================================
  postgres-user:
    image: postgres:16
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ============================================================
  # PRODUCT DATABASE
  # ============================================================
  postgres-product:
    image: postgres:16
    container_name: postgres-product
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ============================================================
  # ORDER DATABASE
  # ============================================================
  postgres-order:
    image: postgres:16
    container_name: postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ============================================================
  # USER SERVICE
  # ============================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: dev
      USER_DB_URL: jdbc:postgresql://postgres-user:5432/user_db
      USER_DB_USERNAME: postgres
      USER_DB_PASSWORD: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - config-server
      - eureka-server
      - postgres-user
      - redis
    networks:
      - microservices-network

  # ============================================================
  # PRODUCT SERVICE
  # ============================================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: product-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: dev
      PRODUCT_DB_URL: jdbc:postgresql://postgres-product:5432/product_db
      PRODUCT_DB_USERNAME: postgres
      PRODUCT_DB_PASSWORD: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - config-server
      - eureka-server
      - postgres-product
      - redis
    networks:
      - microservices-network

  # ============================================================
  # ORDER SERVICE
  # ============================================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: order-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_PROFILES_ACTIVE: dev
      ORDER_DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      ORDER_DB_USERNAME: postgres
      ORDER_DB_PASSWORD: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: your-very-long-random-secret-key-change-this-in-production-min-256-bits
    depends_on:
      - config-server
      - eureka-server
      - postgres-order
      - product-service
      - redis
    networks:
      - microservices-network

  # ============================================================
  # API GATEWAY
  # ============================================================
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: gateway-service
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  user_postgres_data:
  product_postgres_data:
  order_postgres_data:


# ==============================================================
# NETWORK
# ==============================================================
networks:
  microservices-network:
    driver: bridge